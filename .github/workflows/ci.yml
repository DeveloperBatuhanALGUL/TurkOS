name: TurkOS CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  static-checks:
    name: Static Code Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject inline comments in source files
        run: |
          set -e
          VIOLATIONS=0
          for f in $(find . -name "*.c" -o -name "*.h" -o -name "*.s"); do
            CONTENT=$(tail -n +6 "$f")
            if echo "$CONTENT" | grep -nE '(^|[^:])//' | grep -v '://' ; then
              echo "Inline // comment found in $f"
              VIOLATIONS=1
            fi
            if echo "$CONTENT" | grep -nE '/\*' ; then
              echo "Block /* comment found in $f"
              VIOLATIONS=1
            fi
          done
          if [ "$VIOLATIONS" -eq 1 ]; then
            echo "FAILED: inline comments are not permitted past the copyright header."
            exit 1
          fi
          echo "OK: no inline comments found."

      - name: Reject emoji in tracked files
        run: |
          set -e
          if grep -rPn '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' --include="*.c" --include="*.h" --include="*.s" --include="*.md" --include="*.sh" . ; then
            echo "FAILED: emoji found in tracked files."
            exit 1
          fi
          echo "OK: no emoji found."

      - name: Check UTF-8 validity of all filenames
        run: |
          set -e
          find . -path ./.git -prune -o -print | while read -r f; do
            python3 -c "import sys; sys.argv[1].encode('utf-8')" "$f" || { echo "Invalid UTF-8 path: $f"; exit 1; }
          done
          echo "OK: all filenames are valid UTF-8."

  build-and-boot:
    name: Build and Boot Smoke Test
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo qemu-system-x86 wget

      - name: Cache cross-compiler toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: i686-elf-toolchain-binutils2.42-gcc13.2.0-${{ runner.os }}

      - name: Build i686-elf binutils and gcc
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          export PREFIX="$HOME/opt/cross"
          export TARGET=i686-elf
          export PATH="$PREFIX/bin:$PATH"
          mkdir -p "$PREFIX" src && cd src

          wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.gz
          tar xf binutils-2.42.tar.gz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.42/configure --target=$TARGET --prefix="$PREFIX" --with-sysroot --disable-nls --disable-werror
          make -j$(nproc)
          make install
          cd ..

          wget -q https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.gz
          tar xf gcc-13.2.0.tar.gz
          mkdir build-gcc && cd build-gcc
          ../gcc-13.2.0/configure --target=$TARGET --prefix="$PREFIX" --disable-nls --enable-languages=c --without-headers
          make -j$(nproc) all-gcc all-target-libgcc
          make install-gcc install-target-libgcc

      - name: Run Batuss build script
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          export LANG=en_US.UTF-8
          chmod +x batuss-derle.sh
          ./batuss-derle.sh

      - name: Boot smoke test in QEMU
        run: |
          timeout 15 qemu-system-i386 -kernel derleme/turkos.elf -display none -serial stdio -no-reboot -no-shutdown || true
          test -f derleme/turkos.elf
          echo "OK: kernel image produced and QEMU did not crash on launch."
