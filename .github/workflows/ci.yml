name: TurkOS CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  static-checks:
    name: Static Code Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject inline comments in source files
        run: |
          set -e
          VIOLATIONS=0
          for f in $(find . -name "*.c" -o -name "*.h" -o -name "*.s"); do
            CONTENT=$(tail -n +6 "$f")
            if echo "$CONTENT" | grep -nE '(^|[^:])//' | grep -v '://' ; then
              echo "Inline // comment found in $f"
              VIOLATIONS=1
            fi
            if echo "$CONTENT" | grep -nE '/\*' ; then
              echo "Block /* comment found in $f"
              VIOLATIONS=1
            fi
          done
          if [ "$VIOLATIONS" -eq 1 ]; then
            echo "FAILED: inline comments are not permitted past the copyright header."
            exit 1
          fi
          echo "OK: no inline comments found."

      - name: Reject emoji in tracked files
        run: |
          set -e
          if grep -rPn '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' --include="*.c" --include="*.h" --include="*.s" --include="*.md" --include="*.sh" . ; then
            echo "FAILED: emoji found in tracked files."
            exit 1
          fi
          echo "OK: no emoji found."

      - name: Check UTF-8 validity of all filenames
        run: |
          set -e
          find . -path ./.git -prune -o -print | while read -r f; do
            python3 -c "import sys; sys.argv[1].encode('utf-8')" "$f" || { echo "Invalid UTF-8 path: $f"; exit 1; }
          done
          echo "OK: all filenames are valid UTF-8."

  build-and-boot:
    name: Build and Boot Smoke Test
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo qemu-system-x86 nasm wget

      - name: Cache cross-compiler toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: i686-elf-toolchain-binutils2.42-gcc13.2.0-${{ runner.os }}

      - name: Build i686-elf binutils and gcc
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          export PREFIX="$HOME/opt/cross"
          export TARGET=i686-elf
          export PATH="$PREFIX/bin:$PATH"
          mkdir -p "$PREFIX" src && cd src

          wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.gz
          tar xf binutils-2.42.tar.gz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.42/configure --target=$TARGET --prefix="$PREFIX" --with-sysroot --disable-nls --disable-werror
          make -j$(nproc)
          make install
          cd ..

          wget -q https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.gz
          tar xf gcc-13.2.0.tar.gz
          mkdir build-gcc && cd build-gcc
          ../gcc-13.2.0/configure --target=$TARGET --prefix="$PREFIX" --disable-nls --enable-languages=c --without-headers
          make -j$(nproc) all-gcc all-target-libgcc
          make install-gcc install-target-libgcc

      - name: Run Batuss build script
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          export LANG=en_US.UTF-8
          chmod +x batuss-derle.sh
          ./batuss-derle.sh

      - name: Boot test in QEMU from the disk image (with and without NX)
        run: |
          for ISLEMCI in "qemu32" "qemu32,+pae,+nx"; do
            echo "--- CPU: $ISLEMCI ---"
            rm -f kayit.txt
            ( sleep 8; echo "quit" ) | timeout 60 qemu-system-i386 -cpu "$ISLEMCI" -drive format=raw,file=derleme/turkos.img -display none -no-reboot -no-shutdown -monitor stdio -debugcon file:kayit.txt > qemu_monitor.log 2>&1 || true
            test -s kayit.txt || { echo "FAILED: debug channel log is empty ($ISLEMCI)"; cat qemu_monitor.log; exit 1; }
            cat kayit.txt
            echo
            case "$ISLEMCI" in
              *+nx*) BEKLENEN="Islemci: NX var" ;;
              *) BEKLENEN="Islemci: NX YOK" ;;
            esac
            if grep -q "PANIGI" kayit.txt; then echo "FAILED: kernel panic on boot ($ISLEMCI)"; exit 1; fi
            grep -q "Islemci: PAE var" kayit.txt || { echo "FAILED: PAE was not detected ($ISLEMCI)"; exit 1; }
            grep -q "$BEKLENEN" kayit.txt || { echo "FAILED: expected '$BEKLENEN' ($ISLEMCI)"; exit 1; }
            grep -q "SISTEM KILITLENDI" kayit.txt || { echo "FAILED: self-test did not reach the DEVRIYE lockdown ($ISLEMCI)"; exit 1; }
            echo "OK: $ISLEMCI booted, features detected correctly, DEVRIYE lockdown reached."
          done

      - name: Boot sector rejects a corrupted kernel
        run: |
          cp derleme/turkos.img bozuk.img
          python3 -c "d = bytearray(open('bozuk.img', 'rb').read()); d[512 + 0x800] ^= 1; open('bozuk.img', 'wb').write(d)"
          rm -f bozuk_kayit.txt
          ( sleep 8; echo "quit" ) | timeout 60 qemu-system-i386 -cpu "qemu32,+pae,+nx" -drive format=raw,file=bozuk.img -display none -no-reboot -no-shutdown -monitor stdio -debugcon file:bozuk_kayit.txt > qemu_monitor.log 2>&1 || true
          cat bozuk_kayit.txt
          echo
          grep -q "HATA: cekirdek butunlugu bozuk" bozuk_kayit.txt || { echo "FAILED: the boot sector did not report the corrupted kernel"; exit 1; }
          if grep -q "TurkOS Cekirdek Baslatildi" bozuk_kayit.txt; then echo "FAILED: a corrupted kernel was started"; exit 1; fi
          echo "OK: the corrupted kernel was rejected before it ran."

      - name: Guard page catches a kernel stack overflow (test build)
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          export LANG=en_US.UTF-8
          TURKOS_TEST=YIGIN_TASMASI ./batuss-derle.sh
          KORUMA=$(i686-elf-nm derleme/turkos.elf | awk '$3=="gorev_a_alani"{print $1}' | cut -c1-5 | tr a-f A-F)
          rm -f tasma_kayit.txt
          ( sleep 8; echo "quit" ) | timeout 60 qemu-system-i386 -cpu "qemu32,+pae,+nx" -drive format=raw,file=derleme/turkos.img -display none -no-reboot -no-shutdown -monitor stdio -debugcon file:tasma_kayit.txt > qemu_monitor.log 2>&1 || true
          cat tasma_kayit.txt
          echo
          grep -q "TEST: yigin tasmasi deneniyor" tasma_kayit.txt || { echo "FAILED: the test build did not run the overflow test"; exit 1; }
          grep -q "Yigin Tasmasi (Koruma Sayfasi)" tasma_kayit.txt || { echo "FAILED: the stack overflow was not caught by the guard page"; exit 1; }
          grep -q "Kod: 0x$KORUMA" tasma_kayit.txt || { echo "FAILED: the fault address is not inside the task A guard page"; exit 1; }
          echo "OK: the guard page caught the stack overflow and the double fault task reported it."

      - name: Stack protector catches a smashed stack (test build)
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          export LANG=en_US.UTF-8
          TURKOS_TEST=YIGIN_BOZMA ./batuss-derle.sh
          KORUNAN=$(i686-elf-objdump -d derleme/turkos.elf | grep -c 'call.*<__stack_chk_fail>' || true)
          echo "Functions with a stack canary: $KORUNAN"
          test "$KORUNAN" -gt 0 || { echo "FAILED: the kernel was built without stack protection"; exit 1; }
          rm -f bozma_kayit.txt
          ( sleep 8; echo "quit" ) | timeout 60 qemu-system-i386 -cpu "qemu32,+pae,+nx" -drive format=raw,file=derleme/turkos.img -display none -no-reboot -no-shutdown -monitor stdio -debugcon file:bozma_kayit.txt > qemu_monitor.log 2>&1 || true
          cat bozma_kayit.txt
          echo
          grep -q "TEST: yigin bozma deneniyor" bozma_kayit.txt || { echo "FAILED: the test build did not run the stack smashing test"; exit 1; }
          grep -q "Yigin Bozulmasi (Stack Smashing)" bozma_kayit.txt || { echo "FAILED: the smashed stack was not detected"; exit 1; }
          if grep -q "BOZMA YAKALANMADI" bozma_kayit.txt; then echo "FAILED: a function with a smashed stack returned"; exit 1; fi
          echo "OK: the stack canary caught the overwrite before the function returned."
